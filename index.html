<style>
*{box-sizing:border-box}

/* =========================================================
   STORAGE
========================================================= */

const saved=JSON.parse(localStorage.getItem("aungBooksSaved")||"[]");
const progress=JSON.parse(localStorage.getItem("aungBooksProgress")||"{}");
let currentPage="home";
let currentCategory="All";
let currentBook=null;
let currentChapter=0;
let searchText="";

function saveState(){
  localStorage.setItem("aungBooksSaved",JSON.stringify(saved));
  localStorage.setItem("aungBooksProgress",JSON.stringify(progress));
}

function isSaved(id){return saved.includes(id)}

function toggleSave(id,e){
  if(e)e.stopPropagation();
  const i=saved.indexOf(id);
  if(i>-1)saved.splice(i,1);
  else saved.push(id);
  saveState();
  render();
}

/* =========================================================
   NAVIGATION
========================================================= */

function showPage(page){
  currentPage=page;
  if(page!=="explore")currentCategory="All";
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function setCategory(cat){
  currentCategory=cat;
  currentPage="explore";
  render();
}

function openDetail(id){
  const book=books.find(b=>b.id===id);
  if(!book)return;
  currentBook=book;
  renderDetail(book);
  document.getElementById("detailOverlay").classList.add("show");
  document.body.style.overflow="hidden";
}

function closeDetail(){
  document.getElementById("detailOverlay").classList.remove("show");
  document.body.style.overflow="";
}

function openReader(id,start=0){
  const book=books.find(b=>b.id===id);
  if(!book)return;
  currentBook=book;
  currentChapter=start;
  renderReader();
  document.getElementById("readerOverlay").classList.add("show");
  document.body.style.overflow="hidden";
  window.scrollTo(0,0);
}

function closeReader(){
  document.getElementById("readerOverlay").classList.remove("show");
  document.body.style.overflow="";
  render();
}

/* =========================================================
   HOME / EXPLORE
========================================================= */

function categories(){
  return ["All",...new Set(books.map(b=>b.category))];
}

function filteredBooks(){
  return books.filter(b=>{
    const catOk=currentCategory==="All"||b.category===currentCategory;
    const q=searchText.toLowerCase().trim();
    const searchOk=!q||
      b.title.toLowerCase().includes(q)||
      b.author.toLowerCase().includes(q)||
      b.category.toLowerCase().includes(q)||
      b.summary.toLowerCase().includes(q);
    return catOk&&searchOk;
  });
}

function bookCard(book){
  const pct=progress[book.id]||0;
  return `
  <article class="book" onclick="openDetail(${book.id})">
    <div class="cover">
      <span>${String(book.id).padStart(2,"0")}</span>
      ${book.title.split(" ").slice(0,3).join(" ")}
      <span>AUNG BOOKS</span>
    </div>
    <div class="book-body">
      <button class="save ${isSaved(book.id)?"on":""}" onclick="toggleSave(${book.id},event)">
        ${isSaved(book.id)?"★":"☆"}
      </button>
      <h3>${book.title}</h3>
      <div class="author">${book.author}</div>
      <div class="summary">${book.summary}</div>
      <div class="meta">${book.category} · ${book.time} · ${pct}% ဖတ်ပြီး</div>
    </div>
  </article>`;
}

        <p>ကမ္ဘာတစ်ဝှမ်းက တန်ဖိုးရှိတဲ့စာအုပ်တွေရဲ့ အဓိကသင်ခန်းစာတွေကို မြန်မာလို တစ်နေရာတည်းမှာ လေ့လာနိုင်ပါတယ်</p>
        <div class="hero-stat">
          <div class="stat"><b>30</b><span>Books</span></div>
          <div class="stat"><b>300</b><span>Chapters</span></div>

          <div class="summary">သေးငယ်တဲ့အကျင့်တွေက ရေရှည်မှာ ကြီးမားတဲ့ရလဒ်ကို ဖန်တီးနိုင်ပါတယ်</div>
          <div class="meta">Personal Growth · 10 Chapters</div>

      <div class="section-head">

      </div>
    `;
  }

  if(currentPage==="search"){
    main.innerHTML=`
      <div class="section-head"><h2>Search Books</h2></div>
      ${searchBox()}
      <div class="book-grid">
        ${filteredBooks().map(bookCard).join("")}
      </div>
    `;
  }

  if(currentPage==="library"){

    main.innerHTML=`
      <div class="section-head">
        <h2>My Library</h2>
        <span class="muted">${list.length} books</span>
      </div>
      ${list.length
        ? `<div class="book-grid">${list.map(bookCard).join("")}</div>`
        : `<div class="empty">
            <div style="font-size:45px">▣</div>

            <p>စာအုပ်တွေကို Save လုပ်ပြီး ဒီနေရာမှာ ပြန်ဖတ်နိုင်ပါတယ်</p>
           </div>`}
    `;
  }

  if(currentPage==="profile"){
    const readCount=Object.values(progress).filter(x=>x>=100).length;

    main.innerHTML=`
      <div class="profile">

        <h2>စာဖတ်သူ Profile</h2>
        <p>နေ့တိုင်း စာအုပ်တစ်ခန်းစီဖတ်ပြီး ကိုယ့်ဘဝနဲ့လုပ်ငန်းထဲမှာ အသုံးချပါ</p>
      </div>

      <div class="section-head"><h2>Your Progress</h2></div>

      <div class="hero" style="margin-bottom:12px">
        <div class="hero-stat">
          <div class="stat"><b>${savedCount}</b><span>Saved</span></div>
          <div class="stat"><b>${readCount}</b><span>Completed</span></div>
          <div class="stat"><b>${Object.keys(progress).length}</b><span>Started</span></div>
        </div>
      </div>

      <div class="panel">
        <h3>Reading Principle</h3>
        <p>စာအုပ်တစ်အုပ်ဖတ်ပြီးတာထက် အဓိကအယူအဆတစ်ခုကို ကိုယ့်ဘဝမှာ အသုံးချနိုင်တာက ပိုတန်ဖိုးရှိပါတယ်</p>
      </div>
    `;
  }
}

function searchBox(){
  return `
    <div class="search">
      <input
        value="${searchText.replace(/"/g,"&quot;")}"
        oninput="searchText=this.value;render()"
        placeholder="စာအုပ်၊ စာရေးသူ၊ category ရှာပါ..."
      >
    </div>
  `;
}

/* =========================================================
   DETAIL
========================================================= */

function renderDetail(book){
  const pct=progress[book.id]||0;

  document.getElementById("detailOverlay").innerHTML=`
    <div class="detail">

      <button class="close" onclick="closeDetail()">←</button>

      <section class="detail-cover">
        <div style="font-size:11px;color:#aaa">AUNG BOOKS · ${book.category}</div>
        <h1>${book.title}</h1>
        <div class="author">${book.author}</div>
        <span class="tag">${book.time}</span>
      </section>

      <div class="panel">
        <h3>Overall Summary</h3>
        <p>${book.overall}</p>
      </div>

      <div class="panel">
        <h3>စာအုပ်အနှစ်ချုပ်</h3>
        <p>${book.summary}</p>
        <p class="muted">Chapter 10 ခန်း · မူရင်းမြန်မာ summary</p>
      </div>

      <button class="primary" onclick="closeDetail();openReader(${book.id},${Math.min(Math.floor((pct/100)*10),9)})">
        ${pct>0?"▶ ဆက်ဖတ်မယ်":"▶ စဖတ်မယ်"}
      </button>

      <div class="section-head">
        <h2>Chapter Overview</h2>
      </div>

      <div class="chapter-list">
        ${book.chapters.map((c,i)=>`
          <button class="chapter-item" onclick="closeDetail();openReader(${book.id},${i})">
            <span class="chapter-num">${String(i+1).padStart(2,"0")}</span>
            <span>
              <strong>${c.title}</strong>
            </span>
          </button>
        `).join("")}
      </div>

      <div class="panel">
        <h3>Final Takeaways</h3>
        <ul class="takeaways">
          ${book.takeaways.map(x=>`<li>${x}</li>`).join("")}
        </ul>
      </div>

      <div class="panel">
        <h3>Practical Framework</h3>
        <p>${book.framework}</p>
      </div>

      <div class="panel">
        <h3>Business Application</h3>
        <p>${book.business}</p>
      </div>

      <div class="panel">
        <h3>Personal Action Plan</h3>
        <p>${book.actionPlan}</p>
      </div>

      <div class="panel">
        <h3>Reflection Questions</h3>
        <ul class="takeaways">
          ${book.reflection.map(x=>`<li>${x}</li>`).join("")}
        </ul>
      </div>

    </div>
  `;
}

/* =========================================================
   READER
========================================================= */

function renderReader(){
  const b=currentBook;
  const c=b.chapters[currentChapter];
  const total=b.chapters.length;
  const pct=Math.round(((currentChapter+1)/total)*100);

  progress[b.id]=Math.max(progress[b.id]||0,pct);
  saveState();

  document.getElementById("readerOverlay").innerHTML=`
    <div class="reader">

      <div class="reader-top">
        <button class="close" onclick="closeReader()">←</button>
        <button class="save ${isSaved(b.id)?"on":""}" onclick="toggleSave(${b.id})">
          ${isSaved(b.id)?"★":"☆"}
        </button>
      </div>

      <div class="progress">
        <span style="width:${pct}%"></span>
      </div>

      <div class="reader-count">
        ${b.title} · Chapter ${currentChapter+1} / ${total} · ${pct}%
      </div>

      <h1>${c.title}</h1>

      <div class="reader-box">
        <b>အဓိကအယူအဆ</b>
        <p>${c.core}</p>
      </div>

      <h2>အသေးစိတ်ရှင်းလင်းချက်</h2>
      <p>${chapterDetail(b,c)}</p>

      <div class="reader-box">
        <b>🌱 နေ့စဉ်ဘဝ / လက်တွေ့ဥပမာ</b>
        <p>${c.example}</p>
      </div>

      <div class="reader-box">
        <b>💼 Business / Career Application</b>
        <p>${businessExample(b,c)}</p>
      </div>

      <div class="reader-box">
        <b>💰 Money / Personal Application</b>
        <p>${moneyExample(b,c)}</p>
      </div>

      <div class="action">
        <b>ဒီနေ့လုပ်ကြည့်ရန်</b>
        <div style="margin-top:6px">${c.action}</div>
      </div>

      <div class="panel" style="margin-top:15px">
        <h3>🔑 Key Lesson</h3>
        <p>${c.key}</p>
      </div>

      <div class="reader-nav">
        <button onclick="previousChapter()" ${currentChapter===0?"disabled":""}>
          ← Previous
        </button>

        <button onclick="nextChapter()">
          ${currentChapter===total-1?"Final Takeaways":"Next →"}
        </button>
      </div>

    </div>
  `;
}

function chapterDetail(book,c){
  const intros={
    "Personal Growth":"ဒီအယူအဆကို နားလည်ရုံနဲ့မပြီးဘဲ နေ့စဉ်ဆုံးဖြတ်ချက်တွေနဲ့ ချိတ်ဆက်နိုင်မှ တကယ်အသုံးဝင်လာမယ်",
    "Money":"ငွေကြေးနဲ့ပတ်သက်တဲ့ဆုံးဖြတ်ချက်မှာ ရေတိုအကျိုးနဲ့ ရေရှည်အကျိုးကို ခွဲပြီးစဉ်းစားဖို့လိုတယ်",
    "Productivity":"Productivity ဆိုတာ အလုပ်အများကြီးပြီးအောင်လုပ်တာမဟုတ်ဘဲ အရေးကြီးတဲ့ရလဒ်ကို ထုတ်ပေးနိုင်ခြင်းဖြစ်တယ်",
    "Leadership":"Leadership မှာ ကိုယ်တိုင်အလုပ်လုပ်နိုင်တာထက် လူတွေကို direction, clarity နဲ့ accountability ပေးနိုင်တာက ပိုအရေးကြီးတယ်",
    "Communication":"Communication ရဲ့ရည်ရွယ်ချက်က ကိုယ်ပြောတာကိုသာထုတ်ပြတာမဟုတ်ဘဲ တစ်ဖက်လူနားလည်ပြီး အကျိုးရှိတဲ့ action ရလာစေတာဖြစ်တယ်",
    "Business":"Business အယူအဆကို လက်တွေ့စျေးကွက်နဲ့ချိတ်နိုင်မှ အဓိပ္ပာယ်ရှိလာတယ်"
  };
  return `${intros[book.category]||"ဒီအယူအဆကို လက်တွေ့အခြေအနေတွေနဲ့ ချိတ်ဆက်စဉ်းစားနိုင်ပါတယ်"}။ ${c.core} ${c.example} အရေးကြီးတာက အကြောင်းအရာကို သိထားရုံမဟုတ်ဘဲ ကိုယ့်ရဲ့အခြေအနေမှာ ဘယ်လိုအသုံးချနိုင်မလဲဆိုတာ ပြန်စဉ်းစားခြင်းဖြစ်ပါတယ်`;
}

function businessExample(book,c){
  if(book.category==="Business"||book.category==="Leadership"){
    return `${c.example} လုပ်ငန်းခွင်မှာ ဒီအယူအဆကို အသုံးချမယ်ဆိုရင် ရည်မှန်းချက်၊ တာဝန်၊ တိုင်းတာချက်နဲ့ follow-up ကို တစ်ခုတည်းသောစနစ်အဖြစ် ချိတ်ဆက်ထားပါ`;
  }
  return `${c.example} ကို အလုပ်ခွင်မှာ အသုံးချမယ်ဆိုရင် အလုပ်ရဲ့ output၊ customer value နဲ့ team relationship တို့ထဲက ဘယ်နေရာကို ပိုကောင်းစေနိုင်မလဲ စဉ်းစားပါ`;
}

function moneyExample(book,c){
  if(book.category==="Money"){
    return `${c.example} ကို ကိုယ့်ရဲ့ income, expense, saving, debt နဲ့ risk ဆုံးဖြတ်ချက်တွေမှာ ပြန်စစ်ပါ`;
  }
  return `ဒီအယူအဆကို ကိုယ့်ရဲ့အချိန်၊ ငွေကြေးနဲ့ ကိုယ်ပိုင်ဖွံ့ဖြိုးတိုးတက်မှုအတွက် အသုံးချနိုင်ပါတယ်။ ${c.key}`;
}

function previousChapter(){
  if(currentChapter>0){
    currentChapter--;
    renderReader();
    document.getElementById("readerOverlay").scrollTop=0;
  }
}

function nextChapter(){
  if(currentChapter<currentBook.chapters.length-1){
    currentChapter++;
    renderReader();
    document.getElementById("readerOverlay").scrollTop=0;
  }else{
    renderFinal();
  }
}

function renderFinal(){
  const b=currentBook;

  document.getElementById("readerOverlay").innerHTML=`
    <div class="reader">
      <button class="close" onclick="closeReader()">←</button>

      <div class="detail-cover">
        <div style="font-size:11px;color:#aaa">BOOK COMPLETE</div>
        <h1>${b.title}</h1>
        <div class="author">${b.author}</div>
      </div>

      <div class="panel">
        <h3>🎯 Overall Takeaway</h3>
        <p>${b.overall}</p>
      </div>

      <div class="panel">
        <h3>🔑 အရေးကြီးဆုံးအချက် 10 ချက်</h3>
        <ol class="takeaways">
          ${b.takeaways.map(x=>`<li>${x}</li>`).join("")}
        </ol>
      </div>

      <div class="panel">
        <h3>🧠 Practical Framework</h3>
        <p>${b.framework}</p>
      </div>

      <div class="panel">
        <h3>💼 Business Application</h3>
        <p>${b.business}</p>
      </div>

      <div class="panel">
        <h3>🎯 Personal Action Plan</h3>
        <p>${b.actionPlan}</p>
      </div>

      <div class="panel">
        <h3>💭 Reflection Questions</h3>
        <ul class="takeaways">
          ${b.reflection.map(x=>`<li>${x}</li>`).join("")}
        </ul>
      </div>

      <button class="primary" onclick="closeReader();openDetail(${b.id})">
        စာအုပ် Overview ကိုပြန်ကြည့်မယ်
      </button>
    </div>
  `;
}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown",e=>{
  if(!document.getElementById("readerOverlay").classList.contains("show"))return;
  if(e.key==="ArrowRight")nextChapter();
  if(e.key==="ArrowLeft")previousChapter();
  if(e.key==="Escape")closeReader();
});

/* =========================================================
   START
========================================================= */

render();

</script>
</body>
</html>
